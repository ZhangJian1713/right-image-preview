name: Release to npm

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write  # needed to create GitHub Release

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: Type check
        run: npm run check-type

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build library
        run: npm run build:lib

      - name: Check bundle size
        run: npm run size

      - name: Publish to npm (skip if already published locally)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "right-image-preview@${VERSION}" version >/dev/null 2>&1; then
            echo "right-image-preview@${VERSION} already on npm — skipping publish (local-first release)."
          else
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
